# =============================================================================
# notarize-finish.yml - Finish macOS notarizations a release left pending (D3)
#
# release.yml submits the signed app to Apple as soon as it is built, staples
# it, then notarizes and staples the DMG, each wait bounded by its
# notarize_wait_minutes input. When Apple takes longer, the release job uploads
# a macos-notarization-pending-<version> artifact (the files and the submission
# ids, scripts/macos_notarize.py) and succeeds with a warning. This workflow
# finds those artifacts, hourly or for one run when dispatched, and finishes
# the work: wait, staple the app, build and sign the DMG, notarize and staple
# it, attach it to the draft release, and delete the pending artifact. A check
# Apple has not finished stays for the next hour.
#
# The draft carries a DMG only once it is stapled, so a DMG on the draft is how
# scripts/release_windows.ps1 knows macOS is ready.
#
# Dry runs (macos-notarization-pending-<version>-dry-run) are finished only when
# dispatched with their run id, and never touch a release.
#
# Replaces the manual notarize-submit.yml and notarize-check.yml.
# =============================================================================

name: "Notarize: Finish macOS"

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      run_id:
        description: The release.yml (or notarize-finish.yml) run to finish; empty finds every pending notarization
        type: string
        default: ""
      wait_minutes:
        description: How long each wait for Apple may take
        type: string
        default: "30"

permissions:
  contents: read

concurrency:
  group: notarize-finish
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      pending: ${{ steps.find.outputs.pending }}

    steps:
      - uses: actions/checkout@v7

      - name: Find pending notarizations
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          args=(--repository "$GITHUB_REPOSITORY")
          if [ -n "$RUN_ID" ]; then args+=(--run-id "$RUN_ID"); fi
          python3 -u scripts/macos_notarize.py find-pending "${args[@]}"

  finish:
    needs: find
    if: ${{ needs.find.outputs.pending != '' && needs.find.outputs.pending != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        item: ${{ fromJSON(needs.find.outputs.pending) }}
    runs-on: macos-latest
    timeout-minutes: 150
    permissions:
      contents: write   # attach the stapled DMG to the draft release
      actions: write    # delete the pending artifact once finished
    env:
      CODESIGN_IDENTITY: "Developer ID Application: Siddharth Sachar (33PQRTZLNW)"
      VERSION: ${{ matrix.item.version }}
      DRY_RUN: ${{ matrix.item.dry_run }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download the pending notarization
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.item.artifact }}
          run-id: ${{ matrix.item.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/notarization

      - name: Import Apple certificates
        uses: ./.github/actions/import-apple-certificates
        with:
          application-p12: ${{ secrets.APPLE_APPLICATION_P12 }}
          installer-p12: ${{ secrets.APPLE_INSTALLER_P12 }}
          p12-password: ${{ secrets.APPLE_P12_PASSWORD }}
          application-p12-password: ${{ secrets.APPLE_APPLICATION_P12_PASSWORD }}
          installer-p12-password: ${{ secrets.APPLE_INSTALLER_P12_PASSWORD }}

      - name: Wait, staple the app, build the DMG, notarize and staple it
        id: notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WAIT_MINUTES: ${{ inputs.wait_minutes }}
        run: |
          set -euo pipefail
          N="$RUNNER_TEMP/notarization"
          stage() { python3 -c 'import json, sys; s = json.load(open(sys.argv[1])); print("dmg" if (s.get("dmg") or {}).get("submission_id") else "app")' "$N/notarization.json"; }
          echo "stage_before=$(stage)" >> "$GITHUB_OUTPUT"
          args=(--state "$N/notarization.json" --app "$N/app/Row-Bot.app"
                --dmg "$N/Row-Bot-$VERSION-macOS-arm64.dmg" --minutes "${WAIT_MINUTES:-30}")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python -u scripts/macos_notarize.py finish "${args[@]}"
          echo "stage_after=$(stage)" >> "$GITHUB_OUTPUT"

      - name: Gatekeeper accepts what ships
        if: steps.notarize.outputs.readiness == 'ready'
        run: spctl --assess --type open --context context:primary-signature -vv "$RUNNER_TEMP/notarization/Row-Bot-$VERSION-macOS-arm64.dmg"

      - name: macOS notarization summary
        if: always()
        run: python -u scripts/macos_notarize.py summary --state "$RUNNER_TEMP/notarization/notarization.json"

      - name: Upload the macOS DMG
        if: steps.notarize.outputs.readiness == 'ready' || steps.notarize.outputs.readiness == 'app-only'
        uses: actions/upload-artifact@v7
        with:
          name: Row-Bot-macOS
          path: ${{ runner.temp }}/notarization/Row-Bot-*-macOS-*.dmg
          retention-days: 90

      - name: Attach the stapled DMG to the draft release
        if: steps.notarize.outputs.readiness == 'ready' && matrix.item.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          draft="$(gh release view "v$VERSION" --json isDraft --jq .isDraft)"
          if [ "$draft" != "true" ]; then
            echo "::error::v$VERSION is not a draft release; attach the DMG by hand only if you mean to"
            exit 1
          fi
          gh release upload "v$VERSION" "$RUNNER_TEMP/notarization/Row-Bot-$VERSION-macOS-arm64.dmg" --clobber
          echo "The stapled DMG is attached to the draft v$VERSION: macOS is ready." >> "$GITHUB_STEP_SUMMARY"

      # Apple moved on (the app is stapled, the DMG is being checked): keep the new state.
      - name: Upload the pending notarization again
        if: steps.notarize.outputs.readiness == 'pending' && steps.notarize.outputs.stage_before != steps.notarize.outputs.stage_after
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.item.artifact }}
          path: |
            ${{ runner.temp }}/notarization/notarization.json
            ${{ runner.temp }}/notarization/*.zip
            ${{ runner.temp }}/notarization/*.dmg
          retention-days: 14

      - name: Remove the finished or replaced pending artifact
        if: steps.notarize.outputs.readiness == 'ready' || steps.notarize.outputs.readiness == 'app-only' || (steps.notarize.outputs.readiness == 'pending' && steps.notarize.outputs.stage_before != steps.notarize.outputs.stage_after)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/${{ matrix.item.artifact_id }}"
