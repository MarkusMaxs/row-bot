# =============================================================================
# update-manifest.yml - Backstop for the SHA-256 manifest block of a release
#
# Row-Bot's updater trusts only the files the release body's
# `<!-- row-bot-update-manifest -->` block lists: the installers that 5.1 runs,
# and the update description and parts a background update uses. The block is
# written before publishing, from the final files, by scripts/release_windows.ps1;
# container.yml adds its digest file after publishing.
#
# This workflow is the backstop. When a release is published or edited (or on
# a manual run with a tag) it downloads the release's files and runs
# `scripts/append_sha_manifest.py --backstop`: it writes the block if there is
# none and adds files the block does not list, but never changes a listed hash.
# A listed file whose bytes differ fails the run instead, so a correct block is
# never overwritten. Drafts are skipped (their block is written locally).
# =============================================================================

name: Update Manifest

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v5.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  manifest:
    if: ${{ github.event_name != 'release' || !github.event.release.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Event values reach the shell through env, never pasted into the script.
      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then tag="$RELEASE_TAG"; else tag="$INPUT_TAG"; fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::not a release tag: $tag"
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p artifacts

          # Releases published before every file was attached (the 5.1 flow)
          # may get their installers later: poll up to 30 minutes for at least
          # one installer; the `release: edited` trigger retries after that.
          attempts=60        # 60 * 30s = 30 min
          for i in $(seq 1 $attempts); do
            rm -rf artifacts/* 2>/dev/null || true
            gh release download "$TAG" \
              --repo "$REPO" \
              --dir artifacts \
              --pattern "Row-Bot-*-Windows-*.exe" \
              --pattern "Row-Bot-*-macOS-*.dmg" \
              --pattern "Row-Bot-*-Linux-*.tar.gz" \
              --pattern "row-bot-code-*.tar.xz" \
              --pattern "row-bot-assets-*.tar.xz" \
              --pattern "row-bot-pylock-*.toml" \
              --pattern "row-bot-update-*.json" \
              --pattern "row-bot-container-*.json" || true
            shopt -s nullglob
            files=(artifacts/Row-Bot-*-Windows-*.exe artifacts/Row-Bot-*-macOS-*.dmg artifacts/Row-Bot-*-Linux-*.tar.gz)
            if [ ${#files[@]} -gt 0 ]; then
              echo "Found ${#files[@]} installer(s) on attempt $i"
              break
            fi
            echo "Attempt $i/$attempts: no installer assets yet, waiting 30s..."
            sleep 30
          done
          ls -la artifacts/

      # A file that is not one of the release's own fails the run: the block
      # never vouches for a stray upload (a stray installer could match 5.1's patterns).
      - name: Check the SHA256 manifest block (fill it, never overwrite it)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          shopt -s nullglob
          files=(artifacts/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release files found for $TAG - skipping manifest"
            exit 0
          fi
          python scripts/append_sha_manifest.py \
            --tag "$TAG" \
            --backstop \
            --only-release-files \
            --files "${files[@]}"
