name: Live E2E

on:
  workflow_dispatch:
    inputs:
      run_marked_live_tests:
        description: Run all tests marked live_provider or e2e
        type: boolean
        default: false
      run_real_mcp:
        description: Enable real-world MCP E2E checks
        type: boolean
        default: false
      timeout_minutes:
        description: Job timeout in minutes
        type: number
        default: 30
      run_live_eval:
        description: Run the live eval (scripts/live_eval.py, WP B3) with the repository's provider secrets; spends money
        type: boolean
        default: false
      live_eval_providers:
        description: Live eval providers, comma separated (anthropic, openai, google, xai, openrouter, ...)
        type: string
        default: anthropic
      live_eval_tasks:
        description: Live eval task ids, comma separated (empty for the core set)
        type: string
        default: ""
      live_eval_checks:
        description: Also run the live verification checks (tests/e2e/test_live_verification.py)
        type: boolean
        default: false
      live_eval_max_usd:
        description: Live eval cap in US dollars of priced calls (the run stops before passing it)
        type: string
        default: "2"
      live_eval_max_tokens:
        description: Live eval cap in processed tokens, priced or not
        type: string
        default: "1500000"
      live_eval_variant:
        description: Live eval A/B variant (empty for Row-Bot as shipped; see tests/e2e/live_eval/variants.py)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: live-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      ROW_BOT_MCP_REAL_WORLD_E2E: ${{ inputs.run_real_mcp && '1' || '0' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv>=0.7,<1.0"

      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libglib2.0-0 libxcb-cursor0 libportaudio2

      - name: Install Python packages
        run: uv sync --locked --all-extras --group test

      - name: Run selected live MCP checks
        if: ${{ inputs.run_real_mcp }}
        run: uv run python -m pytest tests/e2e/test_mcp_real_world_e2e.py -q

      - name: Run all marked live/e2e tests
        if: ${{ inputs.run_marked_live_tests }}
        run: uv run python -m pytest tests -m "live_provider or e2e" -q

      - name: Confirm no live lane selected
        if: ${{ !inputs.run_real_mcp && !inputs.run_marked_live_tests && !inputs.run_live_eval }}
        run: |
          echo "No live/e2e inputs selected. Re-run this workflow with an explicit live check enabled."

  # The live eval (WP B3): manual dispatch only, never on a pull request. The only job in
  # this workflow that reads secrets: provider API keys, as environment variables. The run
  # uses fresh data folders under .tmp/live-eval and stops before passing the caps above.
  live-eval:
    if: ${{ inputs.run_live_eval }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      ROW_BOT_LIVE_EVAL: "1"
      ROW_BOT_LIVE_EVAL_PROVIDERS: ${{ inputs.live_eval_providers }}
      ROW_BOT_LIVE_EVAL_TASKS: ${{ inputs.live_eval_tasks }}
      ROW_BOT_LIVE_EVAL_MAX_USD: ${{ inputs.live_eval_max_usd }}
      ROW_BOT_LIVE_EVAL_MAX_TOKENS: ${{ inputs.live_eval_max_tokens }}
      ROW_BOT_LIVE_EVAL_VARIANT: ${{ inputs.live_eval_variant }}
      LIVE_EVAL_CHECKS: ${{ inputs.live_eval_checks && '1' || '0' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      ATLASCLOUD_API_KEY: ${{ secrets.ATLASCLOUD_API_KEY }}
      OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv>=0.7,<1.0"

      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libglib2.0-0 libxcb-cursor0 libportaudio2

      - name: Install Python packages
        run: uv sync --locked --all-extras --group test

      - name: Plan (no network)
        run: uv run python scripts/live_eval.py plan

      - name: Run the live eval
        run: |
          if [ "$LIVE_EVAL_CHECKS" = "1" ]; then
            uv run python scripts/live_eval.py run --checks
          else
            uv run python scripts/live_eval.py run
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-eval-report
          path: |
            .tmp/live-eval/*/report.*
            .tmp/live-eval/*/probes.jsonl
            .tmp/live-eval/*/checks/report.*
            .tmp/live-eval/*/workers/*.json
          if-no-files-found: ignore
