name: Smoke the Linux package
description: >-
  Install dist/Row-Bot-*-Linux-*.tar.gz into a temporary HOME and XDG data folder (never
  a real profile), check the releases/<version> layout and state.json, verify the
  installed client assets, start the installed launcher and its `serve` mode, check
  the wrapper's relaunch and rollback rules, and uninstall. Shared by release.yml and
  installer-verify.yml.
inputs:
  port:
    description: Loopback port for the launcher smoke; `serve` uses the next one and the layout smoke the one after
    required: false
    default: "8095"
  background-update:
    description: Also rehearse a real background update to a next version served from a loopback feed (installer-verify)
    required: false
    default: "false"
  update-parts:
    description: With background-update, serve this folder's release parts (build_update_parts.py parts) instead of parts made from the install (release.yml)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install and smoke the Linux package
      shell: bash
      env:
        SMOKE_PORT: ${{ inputs.port }}
        BACKGROUND_UPDATE: ${{ inputs.background-update }}
        UPDATE_PARTS: ${{ inputs.update-parts }}
      run: |
        set -euo pipefail
        SERVE_PORT="$((SMOKE_PORT + 1))"
        LAYOUT_PORT="$((SMOKE_PORT + 2))"
        mkdir -p "$RUNNER_TEMP/row-bot-linux-smoke"
        tar -xzf dist/Row-Bot-*-Linux-*.tar.gz -C "$RUNNER_TEMP/row-bot-linux-smoke"
        PACKAGE_ROOT="$(find "$RUNNER_TEMP/row-bot-linux-smoke" -maxdepth 1 -type d -name 'Row-Bot-*-Linux-*' | head -n 1)"
        if [ -z "$PACKAGE_ROOT" ]; then
          echo "::error::Linux package root not found after extraction"
          exit 1
        fi
        chmod +x "$PACKAGE_ROOT/bin/row-bot"
        export HOME="$RUNNER_TEMP/row-bot-linux-home"
        export XDG_DATA_HOME="$RUNNER_TEMP/row-bot-linux-xdg"
        mkdir -p "$HOME" "$XDG_DATA_HOME"
        bash "$PACKAGE_ROOT/install.sh"

        # The layout: releases/<version>, `current` and state.json.
        ROOT="$XDG_DATA_HOME/row-bot"
        VERSION="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["version"])' "$PACKAGE_ROOT/install_info.json")"
        test "$(readlink "$ROOT/current")" = "releases/$VERSION"
        python3 - "$ROOT/state.json" "$VERSION" <<'PY'
        import json, sys
        state = json.load(open(sys.argv[1]))
        assert state["active"] == sys.argv[2] and state["pending_verification"] is False, state
        PY
        for file in bin/row-bot install.sh uninstall.sh version.json install_info.json; do
          test -f "$ROOT/releases/$VERSION/$file"
        done
        # Shipped bytecode is hash-based and never checked against the source (flags = 1).
        PYC="$(find "$ROOT/current/app/src/row_bot/__pycache__" -name 'install_layout.*.pyc' | head -n 1)"
        python3 -c 'import sys; sys.exit(int.from_bytes(open(sys.argv[1], "rb").read()[4:8], "little") != 1)' "$PYC"

        PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 "$ROOT/current/python/bin/python3" \
          "$GITHUB_WORKSPACE/scripts/verify_client_assets.py" \
          --root "$ROOT/current/app/src/row_bot/static/client-v2" \
          --compare "$GITHUB_WORKSPACE/frontend/dist" --strict
        # The launcher issues its own launch secret, so the smokes use the public probes (B203).
        python3 scripts/smoke_app.py \
          --port "$SMOKE_PORT" \
          --timeout 180 \
          --public-probes \
          --cwd "$ROOT/current/app" \
          -- "$HOME/.local/bin/row-bot" --no-open --no-ollama --port "$SMOKE_PORT"
        python3 scripts/smoke_app.py \
          --port "$SERVE_PORT" \
          --timeout 120 \
          --public-probes \
          --cwd "$ROOT/current/app" \
          -- "$HOME/.local/bin/row-bot" --no-ollama serve --port "$SERVE_PORT"
        # The wrapper relaunches `serve` on exit code 75 and rolls back after two failed starts.
        python3 scripts/smoke_install_layout.py --root "$ROOT" --kind linux --port "$LAYOUT_PORT" \
          -- "$HOME/.local/bin/row-bot" --no-ollama serve --port "$LAYOUT_PORT"
        if [ "$BACKGROUND_UPDATE" = "true" ]; then
          # A real background update to the next version, then Restart now.
          UPDATE_PORT="$((SMOKE_PORT + 3))"
          python3 scripts/smoke_background_update.py --root "$ROOT" --kind linux --port "$UPDATE_PORT" \
            --version-root "$ROOT/releases/$VERSION" ${UPDATE_PARTS:+--parts "$UPDATE_PARTS"} \
            -- "$HOME/.local/bin/row-bot" --no-open --no-ollama --port "$UPDATE_PORT"
        fi

        # Uninstall removes the application files and never the user's data.
        mkdir -p "$HOME/.row-bot"
        echo kept > "$HOME/.row-bot/marker"
        bash "$ROOT/current/uninstall.sh"
        test ! -e "$ROOT"
        test ! -e "$HOME/.local/bin/row-bot"
        test "$(cat "$HOME/.row-bot/marker")" = kept
