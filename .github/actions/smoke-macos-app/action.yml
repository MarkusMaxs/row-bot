name: Smoke the macOS app
description: >-
  Check a built or installed Row-Bot.app (Mach-O host, Info.plist, the tray host's
  self-test, the bundled Python and client assets, the seed version's bytecode),
  start it through the tray host, and check the host's relaunch and rollback
  rules against state.json. Shared by release.yml and installer-verify.yml.
inputs:
  app-path:
    description: Path to Row-Bot.app
    required: true
  port:
    description: Loopback port for the launcher smoke; the layout smoke uses the next one
    required: false
    default: "8097"
  background-update:
    description: Also rehearse a real background update to a next version served from a loopback feed (installer-verify)
    required: false
    default: "false"
  update-parts:
    description: With background-update, serve this folder's release parts (build_update_parts.py parts) instead of parts made from the install (release.yml)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Check and start the app bundle
      shell: bash
      env:
        APP_PATH: ${{ inputs.app-path }}
        SMOKE_PORT: ${{ inputs.port }}
        BACKGROUND_UPDATE: ${{ inputs.background-update }}
        UPDATE_PARTS: ${{ inputs.update-parts }}
      run: |
        set -euo pipefail
        resolve_bundle_python() {
          local resources="$1"
          local candidate
          for candidate in \
            "$resources/python/bin/python3" \
            "$resources/python/bin/python" \
            "$resources/python/bin"/python3.*; do
            if [ -x "$candidate" ]; then
              printf '%s\n' "$candidate"
              return 0
            fi
          done
          return 1
        }

        # The launcher smoke runs from the bundle's app folder, so every path
        # here must be absolute.
        APP_PATH="$(cd "$APP_PATH" && pwd)"
        APP_EXEC="$APP_PATH/Contents/MacOS/row-bot"
        RESOURCES="$APP_PATH/Contents/Resources"
        APP_DIR="$RESOURCES/app"
        VERSION="$(plutil -extract CFBundleShortVersionString raw "$APP_PATH/Contents/Info.plist")"
        test -x "$APP_EXEC"
        file "$APP_EXEC" | grep -q "Mach-O"
        plutil -lint "$APP_PATH/Contents/Info.plist"
        "$APP_EXEC" --self-test
        if ! PYTHON="$(resolve_bundle_python "$RESOURCES")"; then
          echo "::error::Bundled Python not found under $RESOURCES/python/bin"
          find "$APP_PATH" -maxdepth 5 -path '*/python/bin/*' -print || true
          exit 1
        fi
        test -f "$RESOURCES/version.json"
        # The seed version ships hash-based bytecode that is never checked
        # against the source (flags = 1), so nothing in the bundle is rewritten.
        PYC="$(find "$APP_DIR/src/row_bot/__pycache__" -name 'install_layout.*.pyc' | head -n 1)"
        test -n "$PYC"
        "$PYTHON" -I -c 'import sys; flags = int.from_bytes(open(sys.argv[1], "rb").read()[4:8], "little"); sys.exit(flags != 1)' "$PYC"
        PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 "$PYTHON" "$GITHUB_WORKSPACE/scripts/verify_client_assets.py" \
          --root "$APP_DIR/src/row_bot/static/client-v2" \
          --compare "$GITHUB_WORKSPACE/frontend/dist" --strict

        touch "$RUNNER_TEMP/row-bot-smoke-started"
        # Staged versions and state.json go to a throwaway install root.
        export ROW_BOT_INSTALL_ROOT="$(mktemp -d "$RUNNER_TEMP/row-bot-install-root.XXXXXX")"
        # Start the app the way Finder does, through the tray host. The launcher
        # issues its own launch secret, so the smoke uses the public probes (B203).
        # Nothing is written into the bundle.
        python3 scripts/smoke_app.py \
          --port "$SMOKE_PORT" \
          --timeout 180 \
          --public-probes \
          --cwd "$APP_DIR" \
          -- "$APP_EXEC" -- --server --no-open --no-splash --no-ollama --port "$SMOKE_PORT"

        # The host relaunches on exit code 75 and rolls back after two failed starts.
        LAYOUT_PORT="$((SMOKE_PORT + 1))"
        python3 scripts/smoke_install_layout.py --root "$ROW_BOT_INSTALL_ROOT" --kind macos --port "$LAYOUT_PORT" \
          --seed "$RESOURCES" --seed-version "$VERSION" \
          -- "$APP_EXEC" -- --server --no-open --no-splash --no-ollama --port "$LAYOUT_PORT"
        # Worker plugins load from a private environment made by the bundled runtime
        # (-B: nothing may write bytecode into the signed bundle).
        "$RESOURCES/python/bin/python3" -I -B scripts/smoke_plugin_environment.py --app "$RESOURCES/app"
        if [ "$BACKGROUND_UPDATE" = "true" ]; then
          # A real background update to the next version, staged next to the
          # bundle (the seed), then Restart now through the tray host.
          UPDATE_PORT="$((SMOKE_PORT + 2))"
          python3 scripts/smoke_background_update.py --root "$ROW_BOT_INSTALL_ROOT" --kind macos --port "$UPDATE_PORT" \
            --version-root "$RESOURCES" ${UPDATE_PARTS:+--parts "$UPDATE_PARTS"} \
            -- "$APP_EXEC" -- --no-tray --no-open --no-splash --no-ollama --port "$UPDATE_PORT"
        fi
        if [ -n "$(find "$APP_PATH" -newer "$RUNNER_TEMP/row-bot-smoke-started" -name '*.pyc' -print -quit)" ]; then
          echo "::error::Running the app wrote bytecode into the bundle"
          exit 1
        fi
